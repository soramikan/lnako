[package]
name = "test"
version = "1.0.0"
license = "MIT"

# `version = ""` は match-all であり全バージョンを受理するが
# prerelease は受理しないため、prerelease 専用の制約と衝突する。
[dependencies.pkg]
one = { version = "", public-id = "pkg:30000000000000000000000000000000" }
two = { version = ">=1.5.0-alpha <1.5.0", public-id = "pkg:30000000000000000000000000000000" }
