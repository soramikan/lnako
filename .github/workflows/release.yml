name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "検証する配布version（手動実行では公開しない）"
        required: true
        default: "0.0.0-dev"
        type: string

permissions:
  contents: read

jobs:
  preflight:
    name: Validate release source
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release-version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.15.0
      - name: Validate tag, source version, and completed CI
        id: release-version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION_INPUT: ${{ inputs.version }}
          # 51 matrix jobs + dispatch coverage verifier + native AOT aggregate verifier + attestation.
          CI_EXPECTED_JOB_COUNT: 54
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "正式Release tagはvX.Y.Zでなければなりません: $GITHUB_REF_NAME" >&2
              exit 1
            fi
            version="${GITHUB_REF_NAME#v}"
            if [[ "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" != "tag" ]]; then
              echo "Release tagはannotated tagでなければなりません" >&2
              exit 1
            fi
            tag_object="$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{tag}")"
            verified="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}" --jq '.verification.verified')"
            if [[ "$verified" != "true" ]]; then
              echo "GitHubがRelease tagの署名を検証できません: $GITHUB_REF_NAME" >&2
              exit 1
            fi
            ci_run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow CI --commit "$GITHUB_SHA" --limit 50 --json databaseId,status,conclusion --jq '[.[] | select(.status == "completed" and .conclusion == "success") | .databaseId] | .[0] // empty')"
            if [[ -z "$ci_run_id" ]]; then
              echo "同じsource commitのCI成功runがありません: $GITHUB_SHA" >&2
              exit 1
            fi
            ci_job_count="$(gh run view "$ci_run_id" --repo "$GITHUB_REPOSITORY" --json jobs --jq '.jobs | length')"
            ci_non_success_jobs="$(gh run view "$ci_run_id" --repo "$GITHUB_REPOSITORY" --json jobs --jq '[.jobs[] | select(.conclusion != "success")] | length')"
            if [[ "$ci_job_count" -ne "$CI_EXPECTED_JOB_COUNT" || "$ci_non_success_jobs" -ne 0 ]]; then
              echo "同じsource commitのCIが全job成功ではありません: run=$ci_run_id jobs=$ci_job_count/$CI_EXPECTED_JOB_COUNT non_success=$ci_non_success_jobs" >&2
              exit 1
            fi
            echo "同じsource commitのCI全job成功を確認: run=$ci_run_id jobs=$ci_job_count/$CI_EXPECTED_JOB_COUNT"
          else
            version="$RELEASE_VERSION_INPUT"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "versionがsemver形式ではありません: $version" >&2
            exit 1
          fi
          source_version="$(sed -nE 's/^\s*\.version\s*=\s*"([^"]+)".*/\1/p' build.zig.zon | head -n 1)"
          if [[ "$source_version" != "$version" ]]; then
            echo "source versionとRelease versionが一致しません: $source_version/$version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "source commit=$GITHUB_SHA / version=$version / run=$GITHUB_RUN_ID"
      - name: Verify canonical compatibility evidence is fully attested
        # tag pushでのみ要求する。ここで失敗するとbuild/aggregate/publishが
        # 実行されずReleaseを作成できない。手動workflow_dispatchは公開しない
        # 検証用のため対象外。
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f compat/v3.7.24/attestations/current.json ]]; then
            echo "canonical attestationのcurrent pointer（attestations/current.json）が追跡されていません" >&2
            exit 1
          fi
          node tools/sync_compat_evidence.mjs --check
          node tools/check_tracked_dispatch_attestation.mjs

  build:
    name: ${{ matrix.target }} / build benchmark distribution
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            os: macos-15
            environment: release-signing
            executable: lnako
            runtime: liblnako_runtime.a
            extension: tar.gz
          - target: linux-x64
            os: ubuntu-24.04
            executable: lnako
            runtime: liblnako_runtime.a
            extension: tar.gz
          - target: windows-x64
            os: windows-2025
            executable: lnako.exe
            runtime: lnako_runtime.lib
            extension: zip
    runs-on: ${{ matrix.os }}
    environment: ${{ matrix.environment }}
    timeout-minutes: 120
    env:
      LNAKO_VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
          use-cache: true
          cache-key: release-${{ matrix.target }}
          cache-size-limit: 1536
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.15.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/toolchains
          key: release-toolchains-llvm-22.1.8-quickjs-2026-06-04-${{ matrix.target }}-v3-minimal
          restore-keys: |
            release-toolchains-llvm-22.1.8-quickjs-2026-06-04-${{ matrix.target }}-v2
            release-toolchains-llvm-22.1.8-${{ matrix.target }}-v1
      - name: Set up pinned LLVM and LLD
        shell: bash
        run: node tools/setup_llvm.mjs
      - name: Prune LLVM toolchain cache
        shell: bash
        run: node tools/prune_llvm_toolchain.mjs
      - name: Set up pinned QuickJS
        shell: bash
        run: node tools/setup_quickjs.mjs
      - name: Clear generated install outputs
        shell: bash
        run: rm -rf -- zig-out
      - name: Build ReleaseSafe compiler and AOT runtime
        shell: bash
        run: zig build -Doptimize=ReleaseSafe -Dcompat-js=true
      - name: Verify compiler version
        shell: bash
        run: |
          actual="$(./zig-out/bin/${{ matrix.executable }} --version | tr -d '\r\n')"
          test "$actual" = "lnako $LNAKO_VERSION"
      - name: Verify bundled QuickJS packaging boundaries
        shell: bash
        run: |
          set -euo pipefail
          ext=""
          if [[ "${{ matrix.executable }}" == "lnako.exe" ]]; then ext=".exe"; fi
          # 配布コンパイラはQuickJSを静的同梱し、--compat-jsがそのまま動作する。
          ./zig-out/bin/${{ matrix.executable }} run tests/fixtures/compat-js-basic.nako3 --compat-js > /dev/null
          # compat-js指定の生成物にだけQuickJSを含める。
          ./zig-out/bin/${{ matrix.executable }} build tests/fixtures/compat-js-basic.nako3 --compat-js -o "$RUNNER_TEMP/lnako-compat-smoke$ext"
          "$RUNNER_TEMP/lnako-compat-smoke$ext" > /dev/null
          grep -aq "unexpected token in expression" "$RUNNER_TEMP/lnako-compat-smoke$ext"
          # 通常AOT生成物とAOT runtimeライブラリにはQuickJSを含めない。
          printf '1+2を表示\n' > "$RUNNER_TEMP/plain.nako3"
          ./zig-out/bin/${{ matrix.executable }} build "$RUNNER_TEMP/plain.nako3" -o "$RUNNER_TEMP/lnako-native-smoke$ext"
          [[ "$("$RUNNER_TEMP/lnako-native-smoke$ext")" == "3" ]]
          ! grep -aq "unexpected token in expression" "$RUNNER_TEMP/lnako-native-smoke$ext"
          ! grep -aq "unexpected token in expression" zig-out/lib/${{ matrix.runtime }}
      - name: Verify toolchain command manages LLVM
        shell: bash
        run: |
          set -euo pipefail
          ext=""
          if [[ "${{ matrix.executable }}" == "lnako.exe" ]]; then ext=".exe"; fi
          export LNAKO_TOOLCHAIN_DIR="$RUNNER_TEMP/lnako-toolchains"
          # status/dirが管理dirを表示する。
          ./zig-out/bin/${{ matrix.executable }} toolchain status
          [[ "$(./zig-out/bin/${{ matrix.executable }} toolchain dir)" == "$LNAKO_TOOLCHAIN_DIR" ]]
          # 既存LLVMを管理dirへ登録し、LNAKO_LLVM_DIRなしでAOTビルドできる。
          ./zig-out/bin/${{ matrix.executable }} toolchain install --from-dir "$LNAKO_LLVM_DIR"
          env -u LNAKO_LLVM_DIR -u LNAKO_LLVM_LIBRARY ./zig-out/bin/${{ matrix.executable }} toolchain status
          printf '3*4を表示\n' > "$RUNNER_TEMP/managed.nako3"
          env -u LNAKO_LLVM_DIR -u LNAKO_LLVM_LIBRARY ./zig-out/bin/${{ matrix.executable }} build "$RUNNER_TEMP/managed.nako3" -o "$RUNNER_TEMP/lnako-managed-smoke$ext"
          [[ "$("$RUNNER_TEMP/lnako-managed-smoke$ext")" == "12" ]]
          ./zig-out/bin/${{ matrix.executable }} toolchain remove
          env -u LNAKO_LLVM_DIR -u LNAKO_LLVM_LIBRARY ./zig-out/bin/${{ matrix.executable }} toolchain status
      - name: Run benchmark for this target
        env:
          LNAKO_BENCHMARK_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          ./zig-out/bin/${{ matrix.executable }} benchmark \
            --suite benchmarks/suites/v2.json \
            --profile full \
            --output "$RUNNER_TEMP/benchmark-${{ matrix.target }}.json" \
            --markdown "$RUNNER_TEMP/benchmark-${{ matrix.target }}.md"
      - name: Verify benchmark result
        shell: bash
        run: |
          node tools/check_benchmark_result.mjs \
            --json "$RUNNER_TEMP/benchmark-${{ matrix.target }}.json" \
            --markdown "$RUNNER_TEMP/benchmark-${{ matrix.target }}.md"
      - name: Prepare macOS signing keychain
        if: matrix.target == 'macos-arm64'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: node tools/macos_signing.mjs setup
      - name: Create distribution archives
        shell: bash
        run: |
          set -euo pipefail
          signing_args=()
          if [[ "${{ matrix.target }}" == "macos-arm64" ]]; then signing_args+=(--sign-macos); fi
          # standard版はLLVMを同梱しない。ユーザーは`lnako toolchain install`で
          # pin済みLLVMを導入するか、LNAKO_LLVM_DIRで既存LLVMを指定する。
          node tools/create_distribution.mjs "${signing_args[@]}" \
            --version "$LNAKO_VERSION" \
            --target "${{ matrix.target }}" \
            --variant standard \
            --output "$RUNNER_TEMP/dist-standard" \
            --binary "$GITHUB_WORKSPACE/zig-out/bin/${{ matrix.executable }}" \
            --runtime "$GITHUB_WORKSPACE/zig-out/lib/${{ matrix.runtime }}"
          # full版はLLVM/LLDをllvm/へ同梱し、導入直後からオフラインで`lnako build`できる。
          node tools/create_distribution.mjs "${signing_args[@]}" \
            --version "$LNAKO_VERSION" \
            --target "${{ matrix.target }}" \
            --variant full \
            --output "$RUNNER_TEMP/dist-full" \
            --binary "$GITHUB_WORKSPACE/zig-out/bin/${{ matrix.executable }}" \
            --runtime "$GITHUB_WORKSPACE/zig-out/lib/${{ matrix.runtime }}" \
            --llvm-dir "$LNAKO_LLVM_DIR" \
            --require-llvm
      - name: Verify distribution archives
        shell: bash
        run: |
          node tools/check_distribution.mjs \
            --archive "$RUNNER_TEMP/dist-standard/lnako-${LNAKO_VERSION}-${{ matrix.target }}.${{ matrix.extension }}"
          node tools/check_distribution.mjs \
            --archive "$RUNNER_TEMP/dist-full/lnako-${LNAKO_VERSION}-${{ matrix.target }}-full.${{ matrix.extension }}"
      - name: Notarize and assess signed macOS distributions
        if: matrix.target == 'macos-arm64'
        env:
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: >-
          node tools/macos_signing.mjs notarize
          "${{ runner.temp }}/dist-standard/lnako-${{ needs.preflight.outputs.version }}-macos-arm64.tar.gz"
          "${{ runner.temp }}/dist-full/lnako-${{ needs.preflight.outputs.version }}-macos-arm64-full.tar.gz"
      - name: Preserve macOS notarization logs
        if: always() && matrix.target == 'macos-arm64'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-notarization-logs
          path: ${{ runner.temp }}/*.notary-log.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Remove macOS signing credentials
        if: always() && matrix.target == 'macos-arm64'
        run: node tools/macos_signing.mjs cleanup
      - name: Stage release assets
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/release-assets-${{ matrix.target }}"
          cp "$RUNNER_TEMP"/dist-standard/lnako-${{ needs.preflight.outputs.version }}-${{ matrix.target }}.* \
             "$RUNNER_TEMP"/dist-full/lnako-${{ needs.preflight.outputs.version }}-${{ matrix.target }}-full.* \
             "$RUNNER_TEMP/benchmark-${{ matrix.target }}.json" \
             "$RUNNER_TEMP/benchmark-${{ matrix.target }}.md" \
             "$RUNNER_TEMP/release-assets-${{ matrix.target }}/"
      - name: Upload target release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lnako-release-${{ matrix.target }}
          # upload-artifactは複数directoryを指定すると共通祖先基準で階層を保持する。
          # dist/等のサブディレクトリ混入を防ぐため、単一の平坦なdirectoryのみを対象にする。
          path: ${{ runner.temp }}/release-assets-${{ matrix.target }}/*
          if-no-files-found: error
          retention-days: 30

  aggregate:
    name: Verify all release assets
    needs: [preflight, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.15.0
      - name: Download target release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: lnako-release-*
          path: ${{ runner.temp }}/release-assets
          merge-multiple: true
      - name: Create combined release checksums
        run: node tools/create_release_checksums.mjs --directory "${{ runner.temp }}/release-assets" --version "${{ needs.preflight.outputs.version }}"
      - name: Verify all distribution assets
        run: node tools/check_release_assets.mjs --directory "${{ runner.temp }}/release-assets" --version "${{ needs.preflight.outputs.version }}"
      - name: Verify all benchmark targets
        run: node tools/check_benchmark_set.mjs --directory "${{ runner.temp }}/release-assets" --version "${{ needs.preflight.outputs.version }}" --commit "${{ github.sha }}"
      - name: Upload verified release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lnako-release-assets-${{ needs.preflight.outputs.version }}
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub Release
    if: github.event_name == 'push'
    needs: [preflight, aggregate]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lnako-release-assets-${{ needs.preflight.outputs.version }}
          path: ${{ runner.temp }}/release-assets
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "lnako ${{ needs.preflight.outputs.version }}" \
            --generate-notes \
            "$RUNNER_TEMP"/release-assets/*
