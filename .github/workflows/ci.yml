name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 変更パスをallow-listで分類し、docs・attestation snapshotのみの変更では
  # 重いmatrixを起動しない。判定不能（diff失敗・base欠落・空diff・手動実行）は
  # 常にfullへ倒し、検証をスキップしない。
  changes:
    name: Classify changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      level: ${{ steps.classify.outputs.level }}
      reason: ${{ steps.classify.outputs.reason }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.15.0
      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          # 分類器はbase側の信頼済み版を実行する。PR側checkoutの改変済み実装は
          # 信用しない（分類器自身の改変で軽量CIを騙す経路を閉じる）。
          # base側に存在しない（この機能の導入直後や削除PR）はfullへ倒す。
          classifier="$RUNNER_TEMP/classify_changes.mjs"
          if [[ -n "$BASE_SHA" ]] && git show "$BASE_SHA:tools/classify_changes.mjs" > "$classifier" 2>/dev/null; then
            node "$classifier" --event "$EVENT_NAME" --base "$BASE_SHA" --output "$GITHUB_OUTPUT"
          else
            printf 'level=full\nreason=no-base-classifier\n' >> "$GITHUB_OUTPUT"
          fi
          # level出力が欠けると全jobが静黙skipされるためfailにする。
          grep -qE '^level=(full|light)$' "$GITHUB_OUTPUT"

  # light相当の変更でも、workflow schema・追跡attestation・docs表・
  # canonical evidenceの整合性は必ず検査する（build不要なcheckerのみ）。
  lightweight:
    name: Lightweight verification
    if: needs.changes.outputs.level == 'light'
    needs: [changes]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.15.0
      - name: Verify documentation and attestation integrity
        shell: bash
        run: |
          set -euo pipefail
          node tools/check_ci_workflow.mjs
          node tools/check_release_workflow.mjs
          node tools/check_dispatch_attestation_security.mjs
          node tools/check_tracked_dispatch_attestation.mjs --offline
          node tools/check_tracked_dispatch_attestation_security.mjs
          node tools/check_docs_current.mjs
          node tools/sync_compat.mjs --check
          node tools/sync_compat_evidence.mjs --check
          node tools/check_interpreter_only_classification.mjs --check
          node tools/check_builtin_catalog.mjs
          node tools/check_low_level_spec.mjs
          node tools/check_low_level_cases.mjs
          node tools/check_source_structure.mjs
          node tools/check_benchmark_result.mjs
          node tools/check_native_aot_artifacts.mjs --self-test
          node tools/check_distribution.mjs --self-test
          # Mock notarization IDs must not be written to the real job summary.
          GITHUB_STEP_SUMMARY= node --test tools/macos_signing.test.mjs
      - name: Change classifier tests
        run: node --test tools/classify_changes_test.mjs

  test:
    name: ${{ matrix.name }} / ${{ matrix.suite }}
    if: needs.changes.outputs.level == 'full'
    needs: [changes]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-24.04
            suite: core
          - name: Linux x86_64
            os: ubuntu-24.04
            suite: standard
          - name: Linux x86_64
            os: ubuntu-24.04
            suite: host
          - name: Linux x86_64
            os: ubuntu-24.04
            suite: compat-aot
          # macOS-hosted runners admit at most five concurrent jobs. Keep the
          # two regular jobs and three native route jobs at exactly five slots;
          # Node host verification is assigned to mac-host-compat at the end of
          # its evidence chain to balance the critical path, while the
          # dispatch evidence/security stay on mac-host-compat, while the
          # coverage audit is distributed across the three native route jobs.
          - name: macOS arm64
            os: macos-15
            suite: mac-core-standard-support
          - name: macOS arm64
            os: macos-15
            suite: mac-host-compat
          - name: Windows x86_64
            os: windows-2025
            suite: core
          - name: Windows x86_64
            os: windows-2025
            suite: standard
          - name: Windows x86_64
            os: windows-2025
            suite: host
          - name: Windows x86_64
            os: windows-2025
            suite: compat-aot
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        if: matrix.suite == 'core' || matrix.suite == 'mac-core-standard-support' || matrix.suite == 'mac-host-compat'
        with:
          fetch-depth: 0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        if: matrix.suite != 'core' && matrix.suite != 'mac-core-standard-support' && matrix.suite != 'mac-host-compat'
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
          use-cache: ${{ matrix.suite == 'host' || matrix.suite == 'mac-core-standard-support' || matrix.suite == 'mac-host-compat' }}
          cache-key: ${{ matrix.suite }}
          cache-size-limit: 1536
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        if: matrix.suite != 'compat-aot'
        with:
          node-version: 24.15.0
      # toolchain cache世代v3。keyにtoolchain定義とsetup scriptのhashを含め、
      # marker欠落でpoisonedなv1/v2 cacheを復元しないようrestore-keysは付けない。
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/toolchains
          key: toolchains-${{ runner.os }}-${{ runner.arch }}-v3-${{ hashFiles('toolchain.lock.json', 'tools/setup_llvm.mjs', 'tools/setup_quickjs.mjs', 'tools/prune_llvm_toolchain.mjs') }}
      - name: Set up pinned LLVM and LLD
        shell: bash
        run: |
          set -euo pipefail
          node --version
          node tools/setup_llvm.mjs
      - name: Prune LLVM toolchain cache
        shell: bash
        run: node tools/prune_llvm_toolchain.mjs
      - name: Set up pinned QuickJS
        shell: bash
        run: node tools/setup_quickjs.mjs
      # zig-out is an install prefix, not part of the Zig cache. Remove any
      # runner-workspace residue before a differential script builds a host
      # compiler, so a stale executable cannot be mistaken for this checkout.
      - name: Clear generated Zig install outputs
        shell: bash
        run: rm -rf -- zig-out
      - name: Verify compatibility baseline
        if: matrix.suite == 'core' || matrix.suite == 'mac-core-standard-support'
        shell: bash
        run: |
          set -euo pipefail
          node tools/check_ci_workflow.mjs
          node tools/check_release_workflow.mjs
          # Mock notarization IDs must not be written to the real job summary.
          GITHUB_STEP_SUMMARY= node --test tools/macos_signing.test.mjs
          node tools/check_dispatch_attestation_security.mjs
          node tools/check_tracked_dispatch_attestation.mjs --offline
          node tools/check_tracked_dispatch_attestation_security.mjs
          node tools/check_docs_current.mjs
          node tools/sync_compat.mjs --check
          node tools/sync_compat_evidence.mjs --check
          node tools/check_interpreter_only_classification.mjs --check
          node tools/check_builtin_catalog.mjs
          node tools/check_low_level_spec.mjs
          node tools/check_low_level_cases.mjs
          node tools/check_source_structure.mjs
          node tools/check_benchmark_result.mjs
          node tools/check_native_aot_artifacts.mjs --self-test
      - name: Distribution package self-test
        if: matrix.suite == 'core' || matrix.suite == 'mac-core-standard-support'
        run: node tools/check_distribution.mjs --self-test
      - name: Zig package isolation check
        if: matrix.suite == 'core' || matrix.suite == 'mac-core-standard-support'
        run: node tools/check_package_isolation.mjs
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: matrix.suite != 'compat-aot'
        with:
          path: .cache/oracle
          key: nadesiko3-oracle-3.7.24-${{ runner.os }}-${{ runner.arch }}-ac3bedbf10111-v4
      - name: Build official oracle
        if: matrix.suite != 'compat-aot'
        run: node tools/setup_oracle.mjs
      - name: Differential lexer test
        if: matrix.suite == 'core' || matrix.suite == 'mac-core-standard-support'
        run: node tools/compare_lexer_oracle.mjs
      - name: Differential syntax transform test
        if: matrix.suite == 'core' || matrix.suite == 'mac-core-standard-support'
        run: node tools/compare_syntax_oracle.mjs
      - name: Differential parser test
        if: matrix.suite == 'core' || matrix.suite == 'mac-core-standard-support'
        run: node tools/compare_parser_oracle.mjs
      - name: Grammar-generating parser fuzz test (macOS)
        if: matrix.suite == 'mac-core-standard-support'
        run: node tools/fuzz_parser_oracle.mjs --iterations 1024 --seed 20260830
      - name: Differential parser diagnostic test
        if: matrix.suite == 'core' || matrix.suite == 'mac-core-standard-support'
        run: node tools/compare_parser_diagnostics_oracle.mjs
      - name: Differential semantic test
        if: matrix.suite == 'core' || matrix.suite == 'mac-core-standard-support'
        run: node tools/compare_semantic_oracle.mjs
      - name: Differential semantic diagnostic test
        if: matrix.suite == 'core' || matrix.suite == 'mac-core-standard-support'
        run: node tools/compare_semantic_diagnostics_oracle.mjs
      - name: Differential dynamic value test
        if: matrix.suite == 'core' || matrix.suite == 'mac-core-standard-support'
        run: node tools/compare_value_oracle.mjs
      - name: Differential interpreter test
        if: matrix.suite == 'core' || matrix.suite == 'mac-core-standard-support'
        run: node tools/compare_interpreter_oracle.mjs
      - name: Differential plugin_system test
        if: matrix.suite == 'core' || matrix.suite == 'mac-core-standard-support'
        shell: bash
        run: |
          set -euo pipefail
          node tools/generate_unicode_case.mjs --check
          node tools/generate_unicode_properties.mjs --check
          node tools/update_plugin_system_implemented.mjs --check
          node tools/check_plugin_system_coverage.mjs
          node tools/check_system_runtime_coverage.mjs
          node tools/compare_plugin_system_oracle.mjs
      - name: Differential standard plugin test
        if: matrix.suite == 'standard' || matrix.suite == 'mac-core-standard-support'
        shell: bash
        run: |
          set -euo pipefail
          node tools/check_standard_plugin_coverage.mjs
          node tools/compare_standard_plugin_oracle.mjs
          node tools/update_supplemental_implemented.mjs --check
          node tools/check_supplemental_plugin_coverage.mjs
          node tools/compare_supplemental_plugin_oracle.mjs
      - name: Differential QuickJS compatibility test
        if: matrix.suite == 'host' || matrix.suite == 'mac-host-compat'
        shell: bash
        run: |
          set -euo pipefail
          node tools/check_compat_js_coverage.mjs
          node tools/compare_compat_js_oracle.mjs
          node tools/check_compat_js_evidence.mjs --no-build
      - name: Native plugin ABI test
        if: matrix.suite == 'host' || matrix.suite == 'mac-host-compat'
        run: node tools/check_native_plugin_abi.mjs --release-safe
      - name: Format
        if: matrix.suite == 'core' || matrix.suite == 'mac-core-standard-support'
        run: zig build fmt-check
      - name: Test
        if: matrix.suite == 'core' || matrix.suite == 'mac-core-standard-support'
        # Zigのtest serverはテスト間で60秒無応答のrunnerを失敗扱いする。
        # 負荷の高いWindows runnerではtestプロセスのスケジュール遅延が60秒を
        # 超えることがあるため、上限を5分へ引き上げる。
        run: zig build test --test-timeout 5m
      - name: Package schema conformance
        if: matrix.suite == 'core' || matrix.suite == 'mac-core-standard-support'
        run: zig build package-schema-check
      - name: Package manifest tool tests
        if: matrix.suite == 'core' || matrix.suite == 'mac-core-standard-support'
        run: node --test tools/semver_range_test.mjs tools/schema_validator_test.mjs
      - name: Benchmark runner tests
        if: matrix.suite == 'core' || matrix.suite == 'mac-core-standard-support'
        run: node --test tools/benchmark_runner_test.mjs tools/setup_benchmark_gonako_test.mjs tools/pre_push_hook_test.mjs
      - name: Attestation snapshot tool tests
        if: matrix.suite == 'core' || matrix.suite == 'mac-core-standard-support'
        run: node --test tools/create_attestation_snapshot_test.mjs tools/check_github_attestation_test.mjs
      - name: Toolchain cache regression tests
        if: matrix.suite == 'core' || matrix.suite == 'mac-core-standard-support'
        run: node --test tools/setup_llvm_test.mjs tools/collect_ci_metrics_test.mjs tools/aot_compiler_artifact_test.mjs
      - name: Change classifier tests
        if: matrix.suite == 'core' || matrix.suite == 'mac-core-standard-support'
        run: node --test tools/classify_changes_test.mjs
      - name: Toolchain command check
        if: matrix.suite == 'core' || matrix.suite == 'mac-core-standard-support'
        shell: bash
        run: |
          set -euo pipefail
          zig build
          node tools/check_toolchain_command.mjs
      # canonical evidence の freshness は正本生成と同じ ReleaseSafe で測る。
      # Debug 出力は canonical と比較しない（意味内容は一致するが別契約）。
      - name: Build macOS normal ReleaseSafe compiler
        if: matrix.suite == 'mac-host-compat'
        run: zig build -Doptimize=ReleaseSafe
      - name: macOS dispatch evidence audit
        if: matrix.suite == 'mac-host-compat'
        run: >
          node tools/check_dispatch_trace.mjs --no-build
          --evidence-output "${{ runner.temp }}/dispatch-evidence-macos-15.json"
      - name: macOS dispatch trace security audit
        if: matrix.suite == 'mac-host-compat'
        run: node tools/check_dispatch_trace_security.mjs --no-build
      - name: Upload macOS native dispatch evidence
        if: matrix.suite == 'mac-host-compat' && always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lnako-dispatch-evidence-macos-15
          path: ${{ runner.temp }}/dispatch-evidence-macos-15.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Test QuickJS build
        if: matrix.suite == 'compat-aot' || matrix.suite == 'mac-host-compat'
        run: zig build -Dcompat-js=true test --test-timeout 5m
      - name: Build QuickJS compiler
        if: matrix.suite == 'compat-aot' || matrix.suite == 'mac-host-compat'
        run: zig build -Dcompat-js=true -Doptimize=ReleaseSafe
      - name: Compatibility smoke test
        if: matrix.suite == 'compat-aot' || matrix.suite == 'mac-host-compat'
        shell: bash
        run: ./zig-out/bin/lnako run tests/fixtures/compat-js-basic.nako3 --compat-js
      # compat-js 証拠は QuickJS ReleaseSafe 直後に生成する（それ以降に
      # compare_compat_js_oracle 相当の Debug compat 再構築が走る step は挟まない）。
      - name: macOS compat-js evidence audit
        if: matrix.suite == 'mac-host-compat'
        run: >
          node tools/check_compat_js_evidence.mjs --no-build
          --evidence-output "${{ runner.temp }}/compat-js-evidence.json"
      - name: Canonical evidence freshness
        if: matrix.suite == 'mac-host-compat'
        run: >
          node tools/check_evidence_freshness.mjs
          --dispatch-evidence "${{ runner.temp }}/dispatch-evidence-macos-15.json"
          --compat-js-evidence "${{ runner.temp }}/compat-js-evidence.json"
      - name: Build macOS AOT verification compiler
        if: matrix.suite == 'mac-core-standard-support' || matrix.suite == 'mac-host-compat'
        run: zig build
      - name: macOS AOT HTTP server oracle
        if: matrix.suite == 'mac-core-standard-support'
        run: node tools/compare_http_server_aot_oracle.mjs --no-build
      - name: Build macOS ReleaseSafe compiler
        if: matrix.suite == 'mac-core-standard-support'
        run: zig build -Doptimize=ReleaseSafe
      - name: macOS normal smoke test
        if: matrix.suite == 'mac-core-standard-support'
        shell: bash
        run: |
          set -euo pipefail
          ./zig-out/bin/lnako --version
          node tools/check_compat_report.mjs --no-build
          ./zig-out/bin/lnako check tests/fixtures/check-valid.nako3
          ./zig-out/bin/lnako check tests/fixtures/module/main.nako3
          ./zig-out/bin/lnako run tests/fixtures/run-control.nako3
          ./zig-out/bin/lnako test tests/fixtures/run-tests.nako3
      # Node host差分は約5分かかるため、最長jobであるmac-core-standard-support
      # からmac-host-compatへ移しクリティカルパスを平準化する。canonical
      # freshnessとDebug build完了後に配置し、証拠生成順を壊さない。
      - name: Differential Node host test
        if: matrix.suite == 'host' || matrix.suite == 'mac-host-compat'
        shell: bash
        run: |
          set -euo pipefail
          node tools/generate_legacy_encoding.mjs --check
          node tools/update_node_implemented.mjs --check
          node tools/check_node_plugin_coverage.mjs
          node tools/compare_node_file_oracle.mjs
          node tools/check_encoding_compat.mjs
          node tools/check_crypto_compat.mjs
          node tools/compare_node_http_oracle.mjs
          node tools/compare_http_server_oracle.mjs
          node tools/compare_node_exit_oracle.mjs
          node tools/compare_node_interrupt_oracle.mjs
          node tools/check_node_current_directory_realpath.mjs
          node tools/check_node_current_directory_errors.mjs
          node tools/check_node_archive_smoke.mjs

  parser_fuzz:
    name: ${{ matrix.name }} / parser fuzz
    if: needs.changes.outputs.level == 'full'
    needs: [changes]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-24.04
            suite: parser-fuzz
          - name: Windows x86_64
            os: windows-2025
            suite: parser-fuzz
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
          use-cache: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.15.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/oracle
          key: nadesiko3-oracle-3.7.24-${{ runner.os }}-${{ runner.arch }}-ac3bedbf10111-v4
      - name: Build official oracle
        run: node tools/setup_oracle.mjs
      - name: Grammar-generating parser fuzz test
        run: node tools/fuzz_parser_oracle.mjs --iterations 1024 --seed 20260830

  # Windows native AOT shardのDebug compiler buildを1回へ集約するproducer。
  # 12 shardが個別にzig build（約3分）する重複を、artifact共有で解消する。
  aot_compiler:
    name: Windows x86_64 / AOT verification compiler
    if: needs.changes.outputs.level == 'full'
    needs: [changes]
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
          use-cache: true
          cache-key: aot-compiler
          cache-size-limit: 1536
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.15.0
      # toolchain cache世代v3。keyにtoolchain定義とsetup scriptのhashを含め、
      # marker欠落でpoisonedなv1/v2 cacheを復元しないようrestore-keysは付けない。
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/toolchains
          key: toolchains-${{ runner.os }}-${{ runner.arch }}-v3-${{ hashFiles('toolchain.lock.json', 'tools/setup_llvm.mjs', 'tools/setup_quickjs.mjs', 'tools/prune_llvm_toolchain.mjs') }}
      - name: Set up pinned LLVM and LLD
        shell: bash
        run: |
          set -euo pipefail
          node --version
          node tools/setup_llvm.mjs
      - name: Prune LLVM toolchain cache
        shell: bash
        run: node tools/prune_llvm_toolchain.mjs
      - name: Build AOT verification compiler
        # 共有artifactは別runnerのshardが実行するため、producerのnative CPU機能を
        # 焼き込むと異なるCPUのshardでSIGILLになる。baseline CPUで生成し、
        # runner間で実行可能にする。
        run: zig build -Dcpu=baseline
      # 共有artifactは12 shardがbuildなしで実行するため、作成前にこのjobで
      # interpreterを一度動かし、壊れたbinaryを配布しないよう早期に検出する。
      - name: Smoke test AOT verification compiler
        shell: bash
        run: |
          set -euo pipefail
          printf '"smoke"を表示\n' > aot-compiler-smoke.nako3
          output=$(zig-out/bin/lnako.exe run aot-compiler-smoke.nako3)
          output="${output%$'\r'}"
          test "$output" = "smoke"
          rm -f aot-compiler-smoke.nako3
      - name: Package shared AOT compiler artifact
        shell: bash
        run: node tools/aot_compiler_artifact.mjs create --binary zig-out/bin/lnako.exe --runtime-lib zig-out/lib/lnako_runtime.lib --out-dir "${{ runner.temp }}/aot-compiler"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lnako-aot-compiler-windows-x64
          path: ${{ runner.temp }}/aot-compiler
          if-no-files-found: error
          retention-days: 1

  aot:
    name: ${{ matrix.name }} / ${{ matrix.jobName }}
    if: needs.changes.outputs.level == 'full'
    needs: [changes]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-24.04
            suite: aot-native
            task: native
            fixtureShardIndex: 0
            fixtureShardCount: 3
            fixtureSharded: true
            optimizationKey: O0
            optimizations: O0
            jobName: AOT native shard 1/3 / O0
          - name: Linux x86_64
            os: ubuntu-24.04
            suite: aot-native
            task: native
            fixtureShardIndex: 0
            fixtureShardCount: 3
            fixtureSharded: true
            optimizationKey: O1
            optimizations: O1
            jobName: AOT native shard 1/3 / O1
