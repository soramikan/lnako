    if: needs.changes.outputs.level == 'full' && needs.test.result == 'success' && needs.aot.result == 'success'
    needs: [changes, test, aot]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
