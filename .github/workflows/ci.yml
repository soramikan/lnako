    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
          use-cache: ${{ matrix.task == 'native' }}
          cache-key: ${{ matrix.suite }}
          cache-size-limit: 1536
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.15.0
      # toolchain cache世代v3。keyにtoolchain定義とsetup scriptのhashを含め、
      # marker欠落でpoisonedなv1/v2 cacheを復元しないようrestore-keysは付けない。
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/toolchains
          key: toolchains-${{ runner.os }}-${{ runner.arch }}-v3-${{ hashFiles('toolchain.lock.json', 'tools/setup_llvm.mjs', 'tools/setup_quickjs.mjs', 'tools/prune_llvm_toolchain.mjs') }}
      - name: Set up pinned LLVM and LLD
        shell: bash
        run: |
          set -euo pipefail
          node --version
          node tools/setup_llvm.mjs
      - name: Prune LLVM toolchain cache
        shell: bash
        run: node tools/prune_llvm_toolchain.mjs
      - name: Set up pinned QuickJS
        shell: bash
        run: node tools/setup_quickjs.mjs
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/oracle
          key: nadesiko3-oracle-3.7.24-${{ runner.os }}-${{ runner.arch }}-ac3bedbf10111-v4
      - name: Build official oracle
        run: node tools/setup_oracle.mjs
      - name: Build AOT verification compiler
        if: matrix.task != 'support-smoke' && !(matrix.task == 'support-dispatch-coverage' && matrix.os == 'ubuntu-24.04')
        run: zig build
      # canonical正本（231件）を供給するLinux coverage shardは、正本生成と
      # freshnessと同じReleaseSafeでbuildする（Debugとの非一致を構造で排除）。
      - name: Build AOT verification compiler (ReleaseSafe)
        if: matrix.task == 'support-dispatch-coverage' && matrix.os == 'ubuntu-24.04'
        run: zig build -Doptimize=ReleaseSafe
      - name: Differential native AOT verification (fixture/route shard)
        if: matrix.task == 'native'
        env:
          LNAKO_NATIVE_ORACLE_JOBS: "1"
          LNAKO_NATIVE_ORACLE_ARTIFACT: ${{ runner.temp }}/lnako-native-oracle-${{ matrix.fixtureShardIndex }}-${{ matrix.optimizationKey }}.json
          FIXTURE_SHARDED: ${{ matrix.fixtureSharded }}
          FIXTURE_SHARD_INDEX: ${{ matrix.fixtureShardIndex }}
          FIXTURE_SHARD_COUNT: ${{ matrix.fixtureShardCount }}
        shell: bash
        run: |
          set -euo pipefail
          native_args=(
            --no-build
            --optimizations "${{ matrix.optimizations }}"
            --artifact "$LNAKO_NATIVE_ORACLE_ARTIFACT"
          )
          if [[ "$FIXTURE_SHARDED" == "true" ]]; then
            native_args+=(--shard-index "$FIXTURE_SHARD_INDEX" --shard-count "$FIXTURE_SHARD_COUNT")
          fi
          node tools/compare_native_oracle.mjs "${native_args[@]}"
      - name: Upload native AOT oracle artifact
        if: matrix.task == 'native' && always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lnako-native-oracle-${{ matrix.os }}-shard-${{ matrix.fixtureShardIndex }}-${{ matrix.optimizationKey }}
          path: ${{ runner.temp }}/lnako-native-oracle-${{ matrix.fixtureShardIndex }}-${{ matrix.optimizationKey }}.json
          if-no-files-found: ignore
          retention-days: 30
      - name: macOS dispatch coverage audit
        if: matrix.name == 'macOS arm64' && matrix.task == 'native'
        run: >
          node tools/check_dispatch_coverage.mjs --no-build
          --fixture-shard-index "${{ matrix.dispatchCoverageShardIndex }}"
          --fixture-shard-count "${{ matrix.dispatchCoverageShardCount }}"
          --output "${{ runner.temp }}/dispatch-coverage-${{ matrix.os }}-${{ matrix.dispatchCoverageShardIndex }}.json"
      - name: Upload macOS native dispatch coverage audit
        if: matrix.name == 'macOS arm64' && matrix.task == 'native' && always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lnako-dispatch-coverage-${{ matrix.os }}-shard-${{ matrix.dispatchCoverageShardIndex }}
          path: ${{ runner.temp }}/dispatch-coverage-${{ matrix.os }}-${{ matrix.dispatchCoverageShardIndex }}.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Differential HTTP server AOT oracle
        if: matrix.task == 'support-http'
        run: node tools/compare_http_server_aot_oracle.mjs --no-build
      - name: Dispatch evidence audit
        if: matrix.task == 'support-dispatch-evidence'
        run: >
          node tools/check_dispatch_trace.mjs --no-build
          --evidence-output "${{ runner.temp }}/dispatch-evidence-${{ matrix.os }}.json"
      # canonical 正本（231件）の freshness は Linux dedicated shard が供給する。
      # macOS native 相乗り・Windows support は既定の56件のまま維持する。
      - name: Dispatch coverage audit
        if: matrix.task == 'support-dispatch-coverage' && matrix.os != 'ubuntu-24.04'
        run: >
          node tools/check_dispatch_coverage.mjs --no-build
          --fixture-shard-index "${{ matrix.fixtureShardIndex }}"
          --fixture-shard-count "${{ matrix.fixtureShardCount }}"
          --output "${{ runner.temp }}/dispatch-coverage-${{ matrix.os }}-${{ matrix.fixtureShardIndex }}.json"
      - name: Dispatch coverage audit (native fixtures)
        if: matrix.task == 'support-dispatch-coverage' && matrix.os == 'ubuntu-24.04'
        run: >
          node tools/check_dispatch_coverage.mjs --no-build --include-native
          --fixture-shard-index "${{ matrix.fixtureShardIndex }}"
          --fixture-shard-count "${{ matrix.fixtureShardCount }}"
          --output "${{ runner.temp }}/dispatch-coverage-${{ matrix.os }}-${{ matrix.fixtureShardIndex }}.json"
      - name: Dispatch trace security audit
        if: matrix.task == 'support-dispatch-evidence'
        run: node tools/check_dispatch_trace_security.mjs --no-build
      - name: Upload native dispatch evidence
        if: matrix.task == 'support-dispatch-evidence' && always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lnako-dispatch-evidence-${{ matrix.os }}
          path: ${{ runner.temp }}/dispatch-evidence-${{ matrix.os }}.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload native dispatch coverage audit
        if: matrix.task == 'support-dispatch-coverage' && always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lnako-dispatch-coverage-${{ matrix.os }}-shard-${{ matrix.fixtureShardIndex }}
          path: ${{ runner.temp }}/dispatch-coverage-${{ matrix.os }}-${{ matrix.fixtureShardIndex }}.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Build ReleaseSafe compiler
        if: matrix.task == 'support-smoke'
        run: zig build -Doptimize=ReleaseSafe
      - name: Normal smoke test
        if: matrix.task == 'support-smoke'
        shell: bash
        run: |
          set -euo pipefail
          ./zig-out/bin/lnako --version
          node tools/check_compat_report.mjs --no-build
          ./zig-out/bin/lnako check tests/fixtures/check-valid.nako3
          ./zig-out/bin/lnako check tests/fixtures/module/main.nako3
          ./zig-out/bin/lnako run tests/fixtures/run-control.nako3
          ./zig-out/bin/lnako test tests/fixtures/run-tests.nako3

