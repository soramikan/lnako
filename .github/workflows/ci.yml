name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-24.04
          - name: macOS arm64
            os: macos-15
          - name: Windows x86_64
            os: windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24.15.0
      - name: Verify compatibility baseline
        run: node tools/sync_compat.mjs --check
      - uses: actions/cache@v4
        with:
          path: .cache/oracle
          key: nadesiko3-oracle-3.7.24-${{ runner.os }}-v1
      - name: Build official oracle
        run: node tools/setup_oracle.mjs
      - name: Differential lexer test
        run: node tools/compare_lexer_oracle.mjs
      - name: Format
        run: zig build fmt-check
      - name: Test
        run: zig build test
      - name: Build
        run: zig build -Doptimize=ReleaseSafe
      - name: Smoke test
        shell: bash
        run: ./zig-out/bin/lnako --version
