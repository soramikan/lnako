name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }} / ${{ matrix.suite }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-24.04
            suite: core
          - name: Linux x86_64
            os: ubuntu-24.04
            suite: standard
          - name: Linux x86_64
            os: ubuntu-24.04
            suite: host
          - name: Linux x86_64
            os: ubuntu-24.04
            suite: aot
          - name: macOS arm64
            os: macos-15
            suite: core
          - name: macOS arm64
            os: macos-15
            suite: standard
          - name: macOS arm64
            os: macos-15
            suite: host
          - name: macOS arm64
            os: macos-15
            suite: aot
          - name: Windows x86_64
            os: windows-2025
            suite: core
          - name: Windows x86_64
            os: windows-2025
            suite: standard
          - name: Windows x86_64
            os: windows-2025
            suite: host
          - name: Windows x86_64
            os: windows-2025
            suite: aot
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          cache-key: ${{ matrix.suite }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24.15.0
      - uses: actions/cache@v6
        with:
          path: .cache/toolchains
          key: toolchains-llvm-22.1.8-quickjs-2026-06-04-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Set up pinned LLVM and LLD
        run: node tools/setup_llvm.mjs
      - name: Set up pinned QuickJS
        run: node tools/setup_quickjs.mjs
      - name: Verify compatibility baseline
        if: matrix.suite == 'core'
        run: |
          node tools/check_ci_workflow.mjs
          node tools/sync_compat.mjs --check
          node tools/check_builtin_catalog.mjs
      - uses: actions/cache@v6
        with:
          path: .cache/oracle
          key: nadesiko3-oracle-3.7.24-${{ runner.os }}-v2
      - name: Build official oracle
        run: node tools/setup_oracle.mjs
      - name: Differential lexer test
        if: matrix.suite == 'core'
        run: node tools/compare_lexer_oracle.mjs
      - name: Differential syntax transform test
        if: matrix.suite == 'core'
        run: node tools/compare_syntax_oracle.mjs
      - name: Differential parser test
        if: matrix.suite == 'core'
        run: node tools/compare_parser_oracle.mjs
      - name: Differential parser diagnostic test
        if: matrix.suite == 'core'
        run: node tools/compare_parser_diagnostics_oracle.mjs
      - name: Differential semantic test
        if: matrix.suite == 'core'
        run: node tools/compare_semantic_oracle.mjs
      - name: Differential semantic diagnostic test
        if: matrix.suite == 'core'
        run: node tools/compare_semantic_diagnostics_oracle.mjs
      - name: Differential dynamic value test
        if: matrix.suite == 'core'
        run: node tools/compare_value_oracle.mjs
      - name: Differential interpreter test
        if: matrix.suite == 'core'
        run: node tools/compare_interpreter_oracle.mjs
      - name: Differential plugin_system test
        if: matrix.suite == 'core'
        run: |
          node tools/generate_unicode_case.mjs --check
          node tools/update_plugin_system_implemented.mjs --check
          node tools/check_plugin_system_coverage.mjs
          node tools/check_system_runtime_coverage.mjs
          node tools/compare_plugin_system_oracle.mjs
      - name: Differential standard plugin test
        if: matrix.suite == 'standard'
        run: |
          node tools/check_standard_plugin_coverage.mjs
          node tools/compare_standard_plugin_oracle.mjs
          node tools/update_supplemental_implemented.mjs --check
          node tools/check_supplemental_plugin_coverage.mjs
          node tools/compare_supplemental_plugin_oracle.mjs
      - name: Differential QuickJS compatibility test
        if: matrix.suite == 'host'
        run: |
          node tools/check_compat_js_coverage.mjs
          node tools/compare_compat_js_oracle.mjs
      - name: Native plugin ABI test
        if: matrix.suite == 'host'
        run: node tools/check_native_plugin_abi.mjs --release-safe
      - name: Differential Node host test
        if: matrix.suite == 'host'
        run: |
          node tools/generate_legacy_encoding.mjs --check
          node tools/update_node_implemented.mjs --check
          node tools/check_node_plugin_coverage.mjs
          node tools/compare_node_file_oracle.mjs
          node tools/check_encoding_compat.mjs
          node tools/check_crypto_compat.mjs
          node tools/compare_node_http_oracle.mjs
          node tools/compare_http_server_oracle.mjs
          node tools/compare_node_exit_oracle.mjs
          node tools/compare_node_interrupt_oracle.mjs
          node tools/check_node_archive_smoke.mjs
      - name: Differential native AOT test
        if: matrix.suite == 'aot'
        run: node tools/compare_native_oracle.mjs
      - name: Format
        if: matrix.suite == 'core'
        run: zig build fmt-check
      - name: Test
        if: matrix.suite == 'core'
        run: zig build test
      - name: Test QuickJS build
        if: matrix.suite == 'aot'
        run: zig build -Dcompat-js=true test
      - name: Build
        if: matrix.suite == 'aot'
        run: zig build -Doptimize=ReleaseSafe
      - name: Build QuickJS compiler
        if: matrix.suite == 'aot'
        run: zig build -Dcompat-js=true -Doptimize=ReleaseSafe
      - name: Smoke test
        if: matrix.suite == 'aot'
        shell: bash
        run: |
          ./zig-out/bin/lnako --version
          node tools/check_compat_report.mjs --no-build
          ./zig-out/bin/lnako check tests/fixtures/check-valid.nako3
          ./zig-out/bin/lnako check tests/fixtures/module/main.nako3
          ./zig-out/bin/lnako run tests/fixtures/run-control.nako3
          ./zig-out/bin/lnako run tests/fixtures/compat-js-basic.nako3 --compat-js
          ./zig-out/bin/lnako test tests/fixtures/run-tests.nako3
