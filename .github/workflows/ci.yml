name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }} / ${{ matrix.suite }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-24.04
            suite: core
          - name: Linux x86_64
            os: ubuntu-24.04
            suite: standard
          - name: Linux x86_64
            os: ubuntu-24.04
            suite: host
          - name: Linux x86_64
            os: ubuntu-24.04
            suite: compat-aot
          # macOS-hosted runners admit at most five concurrent jobs. Bundle the
          # four regular suites so the three native shards and support job can
          # occupy the remaining four macOS slots without queueing a sixth job.
          - name: macOS arm64
            os: macos-15
            suite: mac-bundle
          - name: Windows x86_64
            os: windows-2025
            suite: core
          - name: Windows x86_64
            os: windows-2025
            suite: standard
          - name: Windows x86_64
            os: windows-2025
            suite: host
          - name: Windows x86_64
            os: windows-2025
            suite: compat-aot
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        if: matrix.suite == 'core' || matrix.suite == 'mac-bundle'
        with:
          fetch-depth: 0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        if: matrix.suite != 'core' && matrix.suite != 'mac-bundle'
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
          use-cache: ${{ matrix.suite == 'host' || matrix.suite == 'mac-bundle' }}
          cache-key: ${{ matrix.suite }}
          cache-size-limit: 1536
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        if: matrix.suite != 'compat-aot'
        with:
          node-version: 24.15.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/toolchains
          key: toolchains-llvm-22.1.8-quickjs-2026-06-04-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Set up pinned LLVM and LLD
        run: node tools/setup_llvm.mjs
      - name: Set up pinned QuickJS
        run: node tools/setup_quickjs.mjs
      - name: Verify compatibility baseline
        if: matrix.suite == 'core' || matrix.suite == 'mac-bundle'
        run: |
          node tools/check_ci_workflow.mjs
          node tools/check_dispatch_attestation_security.mjs
          node tools/check_tracked_dispatch_attestation.mjs --offline
          node tools/check_tracked_dispatch_attestation_security.mjs
          node tools/sync_compat.mjs --check
          node tools/sync_compat_evidence.mjs --check
          node tools/check_interpreter_only_classification.mjs --check
          node tools/check_builtin_catalog.mjs
      - name: Distribution package self-test
        if: matrix.suite == 'core' || matrix.suite == 'mac-bundle'
        run: node tools/check_distribution.mjs --self-test
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: matrix.suite != 'compat-aot'
        with:
          path: .cache/oracle
          key: nadesiko3-oracle-3.7.24-${{ runner.os }}-${{ runner.arch }}-ac3bedbf10111-v4
      - name: Build official oracle
        if: matrix.suite != 'compat-aot'
        run: node tools/setup_oracle.mjs
      - name: Differential lexer test
        if: matrix.suite == 'core' || matrix.suite == 'mac-bundle'
        run: node tools/compare_lexer_oracle.mjs
      - name: Differential syntax transform test
        if: matrix.suite == 'core' || matrix.suite == 'mac-bundle'
        run: node tools/compare_syntax_oracle.mjs
      - name: Differential parser test
        if: matrix.suite == 'core' || matrix.suite == 'mac-bundle'
        run: node tools/compare_parser_oracle.mjs
      - name: Grammar-generating parser fuzz test
        if: matrix.suite == 'core' || matrix.suite == 'mac-bundle'
        run: node tools/fuzz_parser_oracle.mjs --iterations 1024 --seed 20260830
      - name: Differential parser diagnostic test
        if: matrix.suite == 'core' || matrix.suite == 'mac-bundle'
        run: node tools/compare_parser_diagnostics_oracle.mjs
      - name: Differential semantic test
        if: matrix.suite == 'core' || matrix.suite == 'mac-bundle'
        run: node tools/compare_semantic_oracle.mjs
      - name: Differential semantic diagnostic test
        if: matrix.suite == 'core' || matrix.suite == 'mac-bundle'
        run: node tools/compare_semantic_diagnostics_oracle.mjs
      - name: Differential dynamic value test
        if: matrix.suite == 'core' || matrix.suite == 'mac-bundle'
        run: node tools/compare_value_oracle.mjs
      - name: Differential interpreter test
        if: matrix.suite == 'core' || matrix.suite == 'mac-bundle'
        run: node tools/compare_interpreter_oracle.mjs
      - name: Differential plugin_system test
        if: matrix.suite == 'core' || matrix.suite == 'mac-bundle'
        run: |
          node tools/generate_unicode_case.mjs --check
          node tools/generate_unicode_properties.mjs --check
          node tools/update_plugin_system_implemented.mjs --check
          node tools/check_plugin_system_coverage.mjs
          node tools/check_system_runtime_coverage.mjs
          node tools/compare_plugin_system_oracle.mjs
      - name: Differential standard plugin test
        if: matrix.suite == 'standard' || matrix.suite == 'mac-bundle'
        run: |
          node tools/check_standard_plugin_coverage.mjs
          node tools/compare_standard_plugin_oracle.mjs
          node tools/update_supplemental_implemented.mjs --check
          node tools/check_supplemental_plugin_coverage.mjs
          node tools/compare_supplemental_plugin_oracle.mjs
      - name: Differential QuickJS compatibility test
        if: matrix.suite == 'host' || matrix.suite == 'mac-bundle'
        run: |
          node tools/check_compat_js_coverage.mjs
          node tools/compare_compat_js_oracle.mjs
      - name: Native plugin ABI test
        if: matrix.suite == 'host' || matrix.suite == 'mac-bundle'
        run: node tools/check_native_plugin_abi.mjs --release-safe
      - name: Differential Node host test
        if: matrix.suite == 'host' || matrix.suite == 'mac-bundle'
        run: |
          node tools/generate_legacy_encoding.mjs --check
          node tools/update_node_implemented.mjs --check
          node tools/check_node_plugin_coverage.mjs
          node tools/compare_node_file_oracle.mjs
          node tools/check_encoding_compat.mjs
          node tools/check_crypto_compat.mjs
          node tools/compare_node_http_oracle.mjs
          node tools/compare_http_server_oracle.mjs
          node tools/compare_node_exit_oracle.mjs
          node tools/compare_node_interrupt_oracle.mjs
          node tools/check_node_current_directory_realpath.mjs
          node tools/check_node_current_directory_errors.mjs
          node tools/check_node_archive_smoke.mjs
      - name: Format
        if: matrix.suite == 'core' || matrix.suite == 'mac-bundle'
        run: zig build fmt-check
      - name: Test
        if: matrix.suite == 'core' || matrix.suite == 'mac-bundle'
        run: zig build test
      - name: Test QuickJS build
        if: matrix.suite == 'compat-aot' || matrix.suite == 'mac-bundle'
        run: zig build -Dcompat-js=true test
      - name: Build QuickJS compiler
        if: matrix.suite == 'compat-aot' || matrix.suite == 'mac-bundle'
        run: zig build -Dcompat-js=true -Doptimize=ReleaseSafe
      - name: Compatibility smoke test
        if: matrix.suite == 'compat-aot' || matrix.suite == 'mac-bundle'
        shell: bash
        run: ./zig-out/bin/lnako run tests/fixtures/compat-js-basic.nako3 --compat-js

  aot:
    name: ${{ matrix.name }} / ${{ matrix.jobName }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-24.04
            suite: aot-native
            task: native
            fixtureShardIndex: 0
            fixtureShardCount: 3
            fixtureSharded: true
            optimizationKey: O0
            optimizations: O0
            jobName: AOT native shard 1/3 / O0
          - name: Linux x86_64
            os: ubuntu-24.04
            suite: aot-native
            task: native
            fixtureShardIndex: 0
            fixtureShardCount: 3
            fixtureSharded: true
            optimizationKey: O1
            optimizations: O1
            jobName: AOT native shard 1/3 / O1
          - name: Linux x86_64
            os: ubuntu-24.04
            suite: aot-native
            task: native
            fixtureShardIndex: 0
            fixtureShardCount: 3
            fixtureSharded: true
            optimizationKey: O2
            optimizations: O2
            jobName: AOT native shard 1/3 / O2
          - name: Linux x86_64
            os: ubuntu-24.04
            suite: aot-native
            task: native
            fixtureShardIndex: 0
            fixtureShardCount: 3
            fixtureSharded: true
            optimizationKey: O3
            optimizations: O3
            jobName: AOT native shard 1/3 / O3
          - name: Linux x86_64
            os: ubuntu-24.04
            suite: aot-native
            task: native
            fixtureShardIndex: 1
            fixtureShardCount: 3
            fixtureSharded: true
            optimizationKey: O0
            optimizations: O0
            jobName: AOT native shard 2/3 / O0
          - name: Linux x86_64
            os: ubuntu-24.04
            suite: aot-native
            task: native
            fixtureShardIndex: 1
            fixtureShardCount: 3
            fixtureSharded: true
            optimizationKey: O1
            optimizations: O1
            jobName: AOT native shard 2/3 / O1
          - name: Linux x86_64
            os: ubuntu-24.04
            suite: aot-native
            task: native
            fixtureShardIndex: 1
            fixtureShardCount: 3
            fixtureSharded: true
            optimizationKey: O2
            optimizations: O2
            jobName: AOT native shard 2/3 / O2
          - name: Linux x86_64
            os: ubuntu-24.04
            suite: aot-native
            task: native
            fixtureShardIndex: 1
            fixtureShardCount: 3
            fixtureSharded: true
            optimizationKey: O3
            optimizations: O3
            jobName: AOT native shard 2/3 / O3
          - name: Linux x86_64
            os: ubuntu-24.04
            suite: aot-native
            task: native
            fixtureShardIndex: 2
            fixtureShardCount: 3
            fixtureSharded: true
            optimizationKey: O0
            optimizations: O0
            jobName: AOT native shard 3/3 / O0
          - name: Linux x86_64
            os: ubuntu-24.04
            suite: aot-native
            task: native
            fixtureShardIndex: 2
            fixtureShardCount: 3
            fixtureSharded: true
            optimizationKey: O1
            optimizations: O1
            jobName: AOT native shard 3/3 / O1
          - name: Linux x86_64
            os: ubuntu-24.04
            suite: aot-native
            task: native
            fixtureShardIndex: 2
            fixtureShardCount: 3
            fixtureSharded: true
            optimizationKey: O2
            optimizations: O2
            jobName: AOT native shard 3/3 / O2
          - name: Linux x86_64
            os: ubuntu-24.04
            suite: aot-native
            task: native
            fixtureShardIndex: 2
            fixtureShardCount: 3
            fixtureSharded: true
            optimizationKey: O3
            optimizations: O3
            jobName: AOT native shard 3/3 / O3
          - name: macOS arm64
            os: macos-15
            suite: aot-native
            task: native
            fixtureShardIndex: 0
            fixtureShardCount: 1
            fixtureSharded: false
            optimizationKey: O0-O1
            optimizations: O0,O1
            jobName: AOT native routes O0+O1
          - name: macOS arm64
            os: macos-15
            suite: aot-native
            task: native
            fixtureShardIndex: 0
            fixtureShardCount: 1
            fixtureSharded: false
            optimizationKey: O2
            optimizations: O2
            jobName: AOT native routes O2
          - name: macOS arm64
            os: macos-15
            suite: aot-native
            task: native
            fixtureShardIndex: 0
            fixtureShardCount: 1
            fixtureSharded: false
            optimizationKey: O3
            optimizations: O3
            jobName: AOT native routes O3
          - name: Windows x86_64
            os: windows-2025
            suite: aot-native
            task: native
            fixtureShardIndex: 0
            fixtureShardCount: 3
            fixtureSharded: true
            optimizationKey: O0
            optimizations: O0
            jobName: AOT native shard 1/3 / O0
          - name: Windows x86_64
            os: windows-2025
            suite: aot-native
            task: native
            fixtureShardIndex: 0
            fixtureShardCount: 3
            fixtureSharded: true
            optimizationKey: O1
            optimizations: O1
            jobName: AOT native shard 1/3 / O1
          - name: Windows x86_64
            os: windows-2025
            suite: aot-native
            task: native
            fixtureShardIndex: 0
            fixtureShardCount: 3
            fixtureSharded: true
            optimizationKey: O2
            optimizations: O2
            jobName: AOT native shard 1/3 / O2
          - name: Windows x86_64
            os: windows-2025
            suite: aot-native
            task: native
            fixtureShardIndex: 0
            fixtureShardCount: 3
            fixtureSharded: true
            optimizationKey: O3
            optimizations: O3
            jobName: AOT native shard 1/3 / O3
          - name: Windows x86_64
            os: windows-2025
            suite: aot-native
            task: native
            fixtureShardIndex: 1
            fixtureShardCount: 3
            fixtureSharded: true
            optimizationKey: O0
            optimizations: O0
            jobName: AOT native shard 2/3 / O0
          - name: Windows x86_64
            os: windows-2025
            suite: aot-native
            task: native
            fixtureShardIndex: 1
            fixtureShardCount: 3
            fixtureSharded: true
            optimizationKey: O1
            optimizations: O1
            jobName: AOT native shard 2/3 / O1
          - name: Windows x86_64
            os: windows-2025
            suite: aot-native
            task: native
            fixtureShardIndex: 1
            fixtureShardCount: 3
            fixtureSharded: true
            optimizationKey: O2
            optimizations: O2
            jobName: AOT native shard 2/3 / O2
          - name: Windows x86_64
            os: windows-2025
            suite: aot-native
            task: native
            fixtureShardIndex: 1
            fixtureShardCount: 3
            fixtureSharded: true
            optimizationKey: O3
            optimizations: O3
            jobName: AOT native shard 2/3 / O3
          - name: Windows x86_64
            os: windows-2025
            suite: aot-native
            task: native
            fixtureShardIndex: 2
            fixtureShardCount: 3
            fixtureSharded: true
            optimizationKey: O0
            optimizations: O0
            jobName: AOT native shard 3/3 / O0
          - name: Windows x86_64
            os: windows-2025
            suite: aot-native
            task: native
            fixtureShardIndex: 2
            fixtureShardCount: 3
            fixtureSharded: true
            optimizationKey: O1
            optimizations: O1
            jobName: AOT native shard 3/3 / O1
          - name: Windows x86_64
            os: windows-2025
            suite: aot-native
            task: native
            fixtureShardIndex: 2
            fixtureShardCount: 3
            fixtureSharded: true
            optimizationKey: O2
            optimizations: O2
            jobName: AOT native shard 3/3 / O2
          - name: Windows x86_64
            os: windows-2025
            suite: aot-native
            task: native
            fixtureShardIndex: 2
            fixtureShardCount: 3
            fixtureSharded: true
            optimizationKey: O3
            optimizations: O3
            jobName: AOT native shard 3/3 / O3
          - name: Linux x86_64
            os: ubuntu-24.04
            suite: aot-support
            task: support
            jobName: AOT support
          - name: macOS arm64
            os: macos-15
            suite: aot-support
            task: support
            jobName: AOT support
          - name: Windows x86_64
            os: windows-2025
            suite: aot-support
            task: support
            jobName: AOT support
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
          use-cache: ${{ matrix.task == 'native' }}
          cache-key: ${{ matrix.suite }}
          cache-size-limit: 1536
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.15.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/toolchains
          key: toolchains-llvm-22.1.8-quickjs-2026-06-04-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Set up pinned LLVM and LLD
        run: node tools/setup_llvm.mjs
      - name: Set up pinned QuickJS
        run: node tools/setup_quickjs.mjs
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/oracle
          key: nadesiko3-oracle-3.7.24-${{ runner.os }}-${{ runner.arch }}-ac3bedbf10111-v4
      - name: Build official oracle
        run: node tools/setup_oracle.mjs
      - name: Build AOT verification compiler
        run: zig build
      - name: Differential native AOT verification (fixture/route shard)
        if: matrix.task == 'native'
        env:
          LNAKO_NATIVE_ORACLE_JOBS: "1"
          LNAKO_NATIVE_ORACLE_ARTIFACT: ${{ runner.temp }}/lnako-native-oracle-${{ matrix.fixtureShardIndex }}-${{ matrix.optimizationKey }}.json
          FIXTURE_SHARDED: ${{ matrix.fixtureSharded }}
          FIXTURE_SHARD_INDEX: ${{ matrix.fixtureShardIndex }}
          FIXTURE_SHARD_COUNT: ${{ matrix.fixtureShardCount }}
        shell: bash
        run: |
          native_args=(
            --no-build
            --optimizations "${{ matrix.optimizations }}"
            --artifact "$LNAKO_NATIVE_ORACLE_ARTIFACT"
          )
          if [[ "$FIXTURE_SHARDED" == "true" ]]; then
            native_args+=(--shard-index "$FIXTURE_SHARD_INDEX" --shard-count "$FIXTURE_SHARD_COUNT")
          fi
          node tools/compare_native_oracle.mjs "${native_args[@]}"
      - name: Upload native AOT oracle artifact
        if: matrix.task == 'native' && always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lnako-native-oracle-${{ matrix.os }}-shard-${{ matrix.fixtureShardIndex }}-${{ matrix.optimizationKey }}
          path: ${{ runner.temp }}/lnako-native-oracle-${{ matrix.fixtureShardIndex }}-${{ matrix.optimizationKey }}.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Differential HTTP server AOT oracle
        if: matrix.task == 'support'
        run: node tools/compare_http_server_aot_oracle.mjs --no-build
      - name: Dispatch evidence/coverage audit
        if: matrix.task == 'support'
        run: >
          node tools/check_dispatch_audits_parallel.mjs
          --evidence-output "${{ runner.temp }}/dispatch-evidence-${{ matrix.os }}.json"
          --coverage-output "${{ runner.temp }}/dispatch-coverage-${{ matrix.os }}.json"
      - name: Dispatch trace security audit
        if: matrix.task == 'support'
        run: node tools/check_dispatch_trace_security.mjs --no-build
      - name: Upload native dispatch evidence
        if: matrix.task == 'support' && always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lnako-dispatch-evidence-${{ matrix.os }}
          path: ${{ runner.temp }}/dispatch-evidence-${{ matrix.os }}.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload native dispatch coverage audit
        if: matrix.task == 'support' && always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lnako-dispatch-coverage-${{ matrix.os }}
          path: ${{ runner.temp }}/dispatch-coverage-${{ matrix.os }}.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Build ReleaseSafe compiler
        if: matrix.task == 'support'
        run: zig build -Doptimize=ReleaseSafe
      - name: Normal smoke test
        if: matrix.task == 'support'
        shell: bash
        run: |
          ./zig-out/bin/lnako --version
          node tools/check_compat_report.mjs --no-build
          ./zig-out/bin/lnako check tests/fixtures/check-valid.nako3
          ./zig-out/bin/lnako check tests/fixtures/module/main.nako3
          ./zig-out/bin/lnako run tests/fixtures/run-control.nako3
          ./zig-out/bin/lnako test tests/fixtures/run-tests.nako3

  attest-dispatch-evidence:
    name: Attest and verify dispatch evidence
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') && needs.test.result == 'success' && needs.aot.result == 'success'
    needs: [test, aot]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Verify tracked attestation history
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/check_tracked_dispatch_attestation.mjs
      - name: Download dispatch evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: lnako-dispatch-evidence-*
          path: ${{ runner.temp }}/dispatch-evidence
          merge-multiple: true
      - name: Generate artifact attestation
        id: attest-dispatch
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/dispatch-evidence/dispatch-evidence-*.json
      - name: Verify artifact attestations and catalog promotion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node tools/verify_dispatch_attestation.mjs \
            --directory "${{ runner.temp }}/dispatch-evidence" \
            --bundle "${{ steps.attest-dispatch.outputs.bundle-path }}" \
            --output "${{ runner.temp }}/dispatch-attestation.json" \
            --catalog-evidence "${{ runner.temp }}/catalog-evidence-verified.json" \
            --repository "${{ github.repository }}" \
            --commit "${{ github.sha }}" \
            --source-ref "refs/heads/main" \
            --workflow "${{ github.repository }}/.github/workflows/ci.yml"
      - name: Upload verified catalog evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lnako-catalog-evidence-verified
          path: |
            ${{ runner.temp }}/catalog-evidence-verified.json
            ${{ runner.temp }}/dispatch-attestation.json
            ${{ steps.attest-dispatch.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 30
