name: Comparison benchmark

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Measurement profile
        type: choice
        options: [smoke, normal, full]
        default: normal
  pull_request:
    paths: ['src/**', 'benchmarks/**', 'tools/*benchmark*', 'tools/lib/benchmark*', '.github/workflows/comparison-benchmark.yml']
  push:
    branches: [main]
    paths: ['src/**', 'benchmarks/**', 'tools/*benchmark*', 'tools/lib/benchmark*', '.github/workflows/comparison-benchmark.yml']
  schedule:
    - cron: '23 18 * * *'

concurrency:
  group: comparison-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  benchmark:
    name: ${{ matrix.target }} / comparison
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            os: macos-15
            shell: bash
            lnako_executable: lnako
          - target: linux-x64
            os: ubuntu-24.04
            shell: bash
            lnako_executable: lnako
          - target: windows-x64
            os: windows-2025
            shell: bash
            lnako_executable: lnako.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
          use-cache: true
          cache-key: comparison-${{ matrix.target }}
          cache-size-limit: 1536

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.15.0

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/oracle
          key: nadesiko3-oracle-3.7.24-${{ runner.os }}-${{ runner.arch }}-ac3bedbf10111-v4

      - name: Build pinned source oracle
        run: node tools/setup_oracle.mjs

      - name: Prepare oracle command
        run: node tools/create_benchmark_oracle_shim.mjs

      - name: Verify oracle version
        run: node .cache/oracle/nadesiko3-3.7.24/src/cnako3.mjs -v

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/toolchains
          key: toolchains-llvm-22.1.8-quickjs-2026-06-04-${{ runner.os }}-${{ runner.arch }}-v2-minimal
          restore-keys: |
            toolchains-llvm-22.1.8-quickjs-2026-06-04-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Set up pinned LLVM and LLD
        shell: bash
        run: node tools/setup_llvm.mjs

      - name: Prune LLVM toolchain cache
        shell: bash
        run: node tools/prune_llvm_toolchain.mjs

      - name: Build ReleaseSafe compiler
        run: zig build -Doptimize=ReleaseSafe

      - name: Fetch previous successful benchmark
        shell: bash
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          previous_run=$(gh run list --workflow comparison-benchmark.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$previous_run" ]; then
            if ! gh run download "$previous_run" --name "comparison-benchmark-${{ matrix.target }}" --dir "$RUNNER_TEMP/benchmark-baseline"; then
              echo '::warning::Previous benchmark artifact unavailable; recording without a baseline.'
            fi
          fi

      - name: Run comparison benchmark
        env:
          BENCHMARK_PROFILE: ${{ github.event_name == 'pull_request' && 'smoke' || inputs.profile || 'normal' }}
          LNAKO_BENCHMARK_LNAKO: ${{ github.workspace }}/zig-out/bin/${{ matrix.lnako_executable }}
        shell: bash
        run: |
          set -euo pipefail
          baseline_args=()
          if [ -f "$RUNNER_TEMP/benchmark-baseline/benchmark-${{ matrix.target }}.json" ]; then
            baseline_args=(--baseline "$RUNNER_TEMP/benchmark-baseline/benchmark-${{ matrix.target }}.json")
          fi
          node tools/run_comparison_benchmark.mjs "${baseline_args[@]}" \
            --suite benchmarks/suites/v2.json \
            --profile "$BENCHMARK_PROFILE" \
            --runtimes lnako,cnako \
            --lnako "$LNAKO_BENCHMARK_LNAKO" \
            --cnako "$LNAKO_BENCHMARK_CNAKO" \
            --output "$RUNNER_TEMP/benchmark-${{ matrix.target }}.json" \
            --markdown "$RUNNER_TEMP/benchmark-${{ matrix.target }}.md"

      - name: Verify comparison benchmark result
        shell: bash
        run: |
          set -euo pipefail
          node tools/check_comparison_benchmark.mjs \
            --json "$RUNNER_TEMP/benchmark-${{ matrix.target }}.json" \
            --markdown "$RUNNER_TEMP/benchmark-${{ matrix.target }}.md"

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: comparison-benchmark-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/benchmark-${{ matrix.target }}.json
            ${{ runner.temp }}/benchmark-${{ matrix.target }}.md
          if-no-files-found: error
          retention-days: 90
